    <ellipse cx="-6" cy="-1.8" rx="1.4" ry="1.9" transform="rotate(-25 -6 -1.8)"/>
    <ellipse cx="-2.8" cy="-4" rx="1.4" ry="1.9"/>
    <ellipse cx=".7" cy="-3.6" rx="1.4" ry="1.9" transform="rotate(15 .7 -3.6)"/>
    <ellipse cx="3.5" cy="-1" rx="1.3" ry="1.8" transform="rotate(30 3.5 -1)"/>
