<svg xmlns="http://www.w3.org/2000/svg" width="440" height="650" viewBox="0 0 440 650" fill="none">
  <defs>
    <linearGradient id="paper" x1="50" y1="117" x2="390" y2="622" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f3e7d0"/>
      <stop offset="1" stop-color="#e9d4b0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="117" x2="440" y2="622" gradientUnits="userSpaceOnUse">
      <stop stop-color="#cfab76"/>
      <stop offset="1" stop-color="#b88b54"/>
    </linearGradient>
    <linearGradient id="base" x1="220" y1="622" x2="220" y2="648" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d6b27e"/>
      <stop offset="1" stop-color="#c49b65"/>
    </linearGradient>
    <pattern id="fibers" width="47" height="39" patternUnits="userSpaceOnUse">
      <path d="m4 8 3-1m25 9 4 1M15 30l3 1m23-3 2-1" stroke="#987347" stroke-opacity=".1" stroke-width=".7" stroke-linecap="round"/>
      <path d="m14 5 2 1m9 17 3-1M5 35l4-1" stroke="#fffaf0" stroke-opacity=".48" stroke-width=".9" stroke-linecap="round"/>
      <circle cx="23" cy="10" r=".6" fill="#9d794d" fill-opacity=".08"/>
    </pattern>
    <pattern id="corrugation" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M1 0v6M4 0v6" stroke="#8d653d" stroke-opacity=".36" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- The interior edges match the game's walls (22 / 418) and floor (622). -->
  <path d="M22 117h396v505H22z" fill="url(#paper)"/>
  <path d="M22 117h396v505H22z" fill="url(#fibers)"/>
  <path d="M22 117h396" stroke="#c9ad81" stroke-width="1.2"/>
  <path d="M23 119h394" stroke="#fff9e9" stroke-opacity=".65"/>

  <!-- Narrow folded sides keep the play area clear. -->
  <path d="M5 128 22 117v505L5 638Z" fill="url(#edge)" stroke="#997344" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="m418 117 17 11v510l-17-16Z" fill="url(#edge)" stroke="#997344" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M22 119v503m396-503v503" stroke="#8c683f" stroke-width="2"/>
  <path d="M25 135v482m390-482v482" stroke="#a57e49" stroke-opacity=".13" stroke-width="5"/>
  <path d="M9 145v478m422-478v478" stroke="#efcea0" stroke-opacity=".65"/>

  <!-- Open flaps at the mouth of the box. -->
  <path d="m22 117-12-19-9 13 9 31 12-8Z" fill="#dcb984" stroke="#a47e4d" stroke-width="1.3" stroke-linejoin="round"/>
  <path d="m418 117 12-19 9 13-9 31-12-8Z" fill="#e3c393" stroke="#a47e4d" stroke-width="1.3" stroke-linejoin="round"/>
  <path d="m3 111 8 27 9-6m417-21-8 27-9-6" stroke="#f4d9b0" stroke-width="1.1"/>
  <path d="m22 117-11 8m407-8 11 8" stroke="#947044" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Folded front edge, corrugated cut edge and a short strip of packing tape. -->
  <path d="M22 622h396l17 16v7a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3v-7Z" fill="url(#base)" stroke="#987043" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M22 622h396l5 5H17Z" fill="#e7ca9c"/>
  <path d="M22 622h396l5 5H17Z" fill="url(#corrugation)"/>
  <path d="M8 638h424" stroke="#ae814e" stroke-opacity=".5"/>
  <path d="m197 624 3-2 3 1 3-1 3 1 3-1 3 1 3-1 3 1 3-1 3 1 3-1 3 1 3-1 4 2 4 24-4-1-3 1-3-1-3 1-3-1-3 1-3-1-3 1-3-1-3 1-3-1-4 1Z" fill="#f5dfad" fill-opacity=".62"/>
  <path d="m200 626-3 19m43-19 3 19" stroke="#f9e8c5" stroke-opacity=".55"/>
  <g fill="#8e673e" opacity=".6" transform="translate(376 635) rotate(-9)">
